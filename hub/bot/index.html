.btn.mic.rec{background:#e03131;color:#fff;border-color:#e03131}
.btn:disabled{opacity:.5}

<script>

   Bot damu — NÃO TRÌNH DUYỆT (bản 2026-10-24)

     (buildMicroPrompt / gradeParseWithRecovery / validateGrade).
   - Tra từ: Wiktionary + Datamuse song song (như app từ vựng).
   - Đố từ: Datamuse, hỏi TỪNG từ một, gợi ý tiếng Anh trước đáp án.
   - Giọng nói: Web Speech API (webkitSpeechRecognition, en-US).
   - Nhánh tùy chọn máy chủ: CHỈ dùng khi bot-endpoint.txt là URL tunnel
     thật (không phải api./www.) VÀ /health trả 200 trong 3.5s; ngoài ra
     chạy não trình duyệt ngay, không treo chờ.
   ===================================================================== */

var quiz=null;           /* phiên đố từ đang chạy */
var busy=false;
var serverBase=null;     /* chỉ set khi máy chủ thật sự khỏe */

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function stripHtml(s){return String(s||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').trim();}
function uniq(a){var seen={},out=[];(a||[]).forEach(function(x){var k=String(x).toLowerCase();if(!seen[k]){seen[k]=1;out.push(x);}});return out;}
function add(text,cls){var d=document.createElement('div');d.className='msg '+(cls||'bot');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function addHTML(html,cls){var d=document.createElement('div');d.className='msg '+(cls||'bot');d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
function wordCount(t){var m=String(t||'').trim().match(/\S+/g);return m?m.length:0;}
function fetchTimeout(url,opts,ms){return new Promise(function(resolve,reject){var c=(typeof AbortController!=='undefined')?new AbortController():null;var t=setTimeout(function(){if(c)c.abort();reject(new Error('timeout'));},ms||15000);var o={};if(opts)for(var k in opts)o[k]=opts[k];if(c)o.signal=c.signal;fetch(url,o).then(function(r){clearTimeout(t);resolve(r);},function(e){clearTimeout(t);reject(e);});});}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ================= POLLINATIONS KEYLESS ================= */
var POLLI_SYS_GRADE='You are damu, a pink capybara and strict IELTS Speaking examiner-coach, like the examiners in real mock-test feedback videos: grade strictly against the OFFICIAL IELTS band descriptors with no grade inflation; quote the candidate exact words before correcting them; explain why that evidence caps the band by referring to the descriptor; then show a concrete upgraded rewrite. Follow the user instruction exactly and output ONLY the requested JSON.';
async function polliAskOnce(prompt,sys,timeoutMs){
  /* Khong seed ngau nhien: Pollinations cache theo prompt — thu lai DUNG prompt cu
     thuong duoc tra ngay tu cache neu luot truoc da chay xong phia may chu. */
  var body={model:'openai',private:true,temperature:0.4,messages:[{role:'system',content:sys||POLLI_SYS_GRADE},{role:'user',content:prompt}]};
  var r=await fetchTimeout('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},timeoutMs||25000);
  if(!r.ok)throw new Error('HTTP '+r.status);
  var raw=await r.text();
  if(!raw||!raw.trim())throw new Error('empty');
  try{var j=JSON.parse(raw);if(j&&j.choices&&j.choices[0]&&j.choices[0].message&&typeof j.choices[0].message.content==='string')return j.choices[0].message.content;}catch(e){}
  return raw;
}
async function polliAsk(prompt,sys,timeoutMs){
  var lastErr=null;
  for(var attempt=0;attempt<2;attempt++){
    try{return await polliAskOnce(prompt,sys,timeoutMs||25000);}catch(e){lastErr=e;if(attempt===0)await sleep(900);}
  }
  /* dự phòng cuối: đường GET văn bản thuần như app luyện nói vẫn dùng —
     CHỈ khi lỗi không phải timeout (timeout mà GET lại chỉ tổ chậm thêm). */
  if(!lastErr||!/timeout/i.test(String(lastErr.message||''))){
    try{
      var url='https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai&system='+encodeURIComponent(sys||POLLI_SYS_GRADE)+'&private=true';
      var r2=await fetchTimeout(url,{},timeoutMs||25000);
      if(!r2.ok)throw new Error('HTTP '+r2.status);
      var t2=await r2.text();if(t2&&t2.trim())return t2;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('pollinations failed');
}

/* ===== Parse / phục hồi JSON — rút gọn từ gradeParseWithRecovery + validateGrade của app luyện nói ===== */
function unwrapEnvelope(t){
  var s=String(t||'').trim();if(!s)return '';
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>=0&&b>a){try{var o=JSON.parse(s.slice(a,b+1));if(o&&typeof o==='object'){
    if(o.choices&&o.choices[0]){var mm=(o.choices[0].message&&o.choices[0].message.content)||o.choices[0].text;if(typeof mm==='string'&&mm.trim())return mm;}
    if(typeof o.content==='string'&&o.content.trim()&&!('score' in o))return o.content;
  }}catch(e){}}
  return s;
}
function extractJSON(text){
  var s=unwrapEnvelope(text);
  s=s.replace(/```(?:json)?/gi,'');
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)return null;
  var cand=s.slice(a,b+1);
  try{return JSON.parse(cand);}catch(e){}
  /* phục hồi: đóng ngoặc còn thiếu khi bị cắt giữa chừng */
  try{
    var fixed=cand.replace(/,\s*$/,'');
    var stack=[],inStr=false,esc2=false;
    for(var i=0;i<fixed.length;i++){var ch=fixed[i];if(esc2){esc2=false;continue;}if(ch==='\\'){esc2=true;continue;}if(ch==='"'){inStr=!inStr;continue;}if(inStr)continue;if(ch==='{'||ch==='[')stack.push(ch);else if(ch==='}'||ch===']')stack.pop();}
    if(inStr)fixed+='"';
    while(stack.length){var o=stack.pop();fixed+=(o==='{'?'}':']');}
    return JSON.parse(fixed);
  }catch(e){}
  return null;
}
function validScore(v){var n=(typeof v==='string')?parseFloat(v):v;return (typeof n==='number'&&isFinite(n)&&n>=0&&n<=9)?Math.round(n*2)/2:null;}
function validateGrade(g){ /* rút gọn: đủ 4 điểm hợp lệ mới coi là bản chấm điểm đầy đủ */
  if(!g||typeof g!=='object')return false;var sc=g.scores||g;
  for(var i=0;i<CRIT.length;i++){if(validScore(sc[CRIT[i][0]])==null)return false;}
  return true;
}

/* ===== buildMicroPrompt — mỗi lượt CHỈ 1 tiêu chí, kèm KHỐI DESCRIPTOR CHÍNH THỨC của riêng tiêu chí đó =====
   Nguồn rubric: IELTS Speaking Band Descriptors (public version, ielts.org) — bản đầy đủ lưu ở
   damu-speaking/research/band-descriptors-public.md. Hai ghi chú chính thức: (i) thí sinh phải khớp
   ĐẦY ĐỦ đặc điểm tích cực của một band mới đạt band đó; (ii) điểm là hiệu năng trung bình qua các phần. */
var DESC={
FC:'Band 4: cannot keep going without noticeable pauses; slow speech with frequent repetition and self-correction; links simple sentences only, with repetitious connectives; some breakdowns in coherence. Band 5: usually keeps going but relies on repetition and self-correction and/or slow speech; hesitations often mid-sentence while searching for fairly basic lexis and grammar; overuses certain discourse markers and connectives; complex speech usually causes disfluency but simpler language may be fluent. Band 6: keeps going and willing to produce long turns; coherence may be lost at times through hesitation, repetition and/or self-correction; uses a range of discourse markers, connectives and cohesive features though not always appropriately. Band 7: long turns produced without noticeable effort; some hesitation, repetition or self-correction, often mid-sentence, but coherence is not affected; flexible use of discourse markers, connectives and cohesive features. Band 8: fluent with only very occasional repetition or self-correction; hesitation mostly to find content, not language; topic development coherent, appropriate and relevant. Band 9 (summary): fluent; hesitation only to prepare content; fully coherent, appropriately extended topic development.',
LR:'Band 4: resource sufficient for familiar topics but only basic meaning conveyed on unfamiliar topics; frequent inappropriacies and errors in word choice; rarely attempts paraphrase. Band 5: resource sufficient for familiar and unfamiliar topics but limited flexibility; attempts paraphrase but not always with success. Band 6: resource sufficient to discuss topics at length; vocabulary use may be inappropriate but meaning is clear; generally able to paraphrase successfully. Band 7: resource flexibly used for a variety of topics; some less common and idiomatic items, with awareness of style and collocation though inappropriacies occur; effective paraphrase as required. Band 8: wide resource readily and flexibly used for all topics and precise meaning; skilful use of less common and idiomatic items despite occasional word-choice and collocation inaccuracies; effective paraphrase. Band 9 (summary): total flexibility and precise use in all contexts; sustained accurate idiomatic language.',
GRA:'Band 4: can produce basic sentence forms and some short utterances are error-free; subordinate clauses rare; turns short, structures repetitive, errors frequent. Band 5: basic sentence forms fairly well controlled for accuracy; complex structures attempted but limited in range, nearly always contain errors and may need reformulation. Band 6: mix of short and complex forms and a variety of structures with limited flexibility; errors frequently occur in complex structures but rarely impede communication. Band 7: a range of structures flexibly used; error-free sentences are frequent; simple and complex sentences used effectively despite some errors; a few basic errors persist. Band 8: wide range of structures flexibly used; the majority of sentences are error-free; only occasional inappropriacies and non-systematic errors; a few basic errors may persist. Band 9 (summary): structures precise and accurate at all times apart from native-like slips.',
P:'Band 4: uses some acceptable phonological features but range limited; some acceptable chunking but frequent lapses in rhythm; intonation and stress attempted but control limited; individual words and phonemes frequently mispronounced causing lack of clarity; understanding requires effort and some patches cannot be understood. Band 5: displays all the positive features of Band 4 and some, but not all, of the positive features of Band 6. Band 6: uses a range of phonological features but control is variable; chunking generally appropriate but rhythm may be affected by lack of stress-timing and/or a rapid rate; some effective intonation and stress but not sustained; individual words or phonemes may be mispronounced but only occasional lack of clarity; generally understood throughout without much effort. Band 7: displays all the positive features of Band 6 and some, but not all, of the positive features of Band 8. Band 8: wide range of phonological features to convey precise and subtle meaning; can sustain appropriate rhythm; flexible stress and intonation across long utterances despite occasional lapses; easily understood throughout; accent has minimal effect on intelligibility. Band 9 (summary): full range of phonological features; effortlessly understood throughout; accent has no effect on intelligibility.'
};
/* Dòng đối chiếu descriptor XÁC ĐỊNH: luôn lấy từ rubric nhúng sẵn (DESC) theo band đạt được,
   KHÔNG phụ thuộc lượt AI có trả descRef hay không — mọi tiêu chí có điểm đều có dòng này. */
function descSegment(key,band){
  var t=DESC[key]||'';var marks=[];var re=/Band (\d)(?: \(summary\))?:/g,m;
  while((m=re.exec(t)))marks.push({b:parseInt(m[1],10),i:m.index,e:re.lastIndex});
  for(var j=0;j<marks.length;j++){if(marks[j].b===band){var end=(j+1<marks.length)?marks[j+1].i:t.length;return t.slice(marks[j].e,end).trim().replace(/[.\s]+$/,'');}}
  return '';
}
function descLineFor(key,score){
  if(score==null)return '';
  var lo=Math.floor(score);
  if(lo<4){var s4=descSegment(key,4);return s4?('Band '+score.toFixed(1)+' — chưa đạt đầy đủ đặc điểm Band 4: '+s4):'';}
  if(lo>9)lo=9;
  var seg=descSegment(key,lo);if(!seg)return '';
  if(score>lo){var segHi=descSegment(key,lo+1);return 'Band '+lo+': '+seg+(segHi?(' — đã chạm một phần Band '+(lo+1)+': '+segHi):'');}
  return 'Band '+lo+': '+seg;
}
var ANCHOR='Anchors from real mock tests: Band 5.0 = chains of short simple sentences, ends sentences with "Yeah", repeats the question stem, basic errors even in simple sentences (e.g. "when I were a child", "the story have traditional Vietnam value"), basic repetitive vocabulary, word-class slips ("physical healthy"), final sounds and final -s dropped. Band 5.5 = answers extended to 3-4 sentences, natural fillers, some relative clauses and one idiom attempt, but tense range narrow (past/present simple only) and slips still land in simple sentences. Band 6.5 = ideas developed across topics, errors only occasional slips. Band 7.5 = long fluent turns on many topics, precise topic-specific vocabulary (heavy footfall, activations), mostly error-free sentences; weakest point often double comparatives (the most hard part, the more easier).';
var SCORE_RULE='SCORING RULE (official): grade by MATCHING the performance against the descriptors above. The candidate must FULLY fit ALL positive features of a band to receive that band; if the fit is incomplete, award the band BELOW. Give .0 or .5 scores only.';
var EXAMINER_STYLE='EXAMINER STYLE (from real examiner feedback videos): name the criterion, QUOTE the candidate exact words, explain WHY that evidence caps the band by referring to the descriptor, then give a concrete upgrade with a rewritten example. English is the main language of the judgement; keep Vietnamese notes short.';
function buildMicroPrompt(key,name,q,part,tr){
  return 'Grade ONLY '+key+' ('+name+') for this IELTS Speaking answer. Be strict, never inflate.\n'
    +'OFFICIAL IELTS BAND DESCRIPTORS for '+key+' ('+name+'):\n'+DESC[key]+'\n'
    +SCORE_RULE+'\n'
    +'CALIBRATION: '+ANCHOR+'\n'
    +EXAMINER_STYLE+'\n'
    +'Return ONLY valid JSON, no markdown: {"score":5.0,"descRef":"Band X: descriptor feature — matches or not fully, because evidence","strength":"1 short genuine strength in Vietnamese tied to this answer","wrong":"exact phrase copied word-for-word from the transcript","fix":"corrected version of that exact phrase","why":"short reason in Vietnamese referring to the descriptor","advice":"specific fix in Vietnamese","drill":"one concrete 5-10 minute drill in Vietnamese tied to that error","bandLink":"Not yet Band X because ...; fixing ... lifts this criterion to Band Y (English, plus a short Vietnamese note if needed)"}\n'
    +'Rules: score is a multiple of 0.5 between 3.0 and 9.0. descRef MUST cite the descriptor band that decided the score. "wrong" MUST be copied character-for-character from the transcript; never invent one — if the answer has no error for '+key+', set "wrong" and "fix" to empty strings. For P (Pronunciation), judge only what a transcript can show (word stress clues, final sounds likely dropped, pausing) and note that limit in "why" if needed. Never use a double-quote character inside string values.\n'
    +'Question (Part '+part+'): "'+String(q||'').slice(0,300)+'"\nTranscript: "'+String(tr||'').slice(0,1100)+'"';
}
function buildRecoveryPrompt(key,name,q,part,tr){
  return 'Grade ONLY '+key+' ('+name+') for this IELTS Speaking answer. Be strict, never inflate.\n'
    +'OFFICIAL IELTS BAND DESCRIPTORS for '+key+':\n'+DESC[key]+'\n'
    +SCORE_RULE+'\nCALIBRATION: '+ANCHOR+'\n'
    +'Return ONLY valid JSON, no markdown: {"score":5.0,"descRef":"Band X: descriptor feature — matches or not fully, because evidence","strength":"1 short strength in Vietnamese","advice":"1 specific fix in Vietnamese"}. Never use a double-quote character inside string values.\n'
    +'Question (Part '+part+'): "'+String(q||'').slice(0,200)+'"\nTranscript: "'+String(tr||'').slice(0,900)+'"';
}
function buildErrorsPrompt(q,part,tr){
  return 'List the 3 most important language errors in this IELTS Speaking answer. Anchor: prioritise errors that cap the band under the official descriptors — basic errors in SIMPLE sentences cap GRA at Band 5; word-choice and word-class errors cap LR at Band 5. Return ONLY valid JSON, no markdown: {"errors":[{"wrong":"exact phrase copied word-for-word from the transcript","fix":"corrected version","why":"short reason in Vietnamese"}]}. Never invent a phrase: every "wrong" must appear word-for-word in the transcript. Never use a double-quote character inside string values.\nQuestion (Part '+part+'): "'+String(q||'').slice(0,300)+'"\nTranscript: "'+String(tr||'').slice(0,1100)+'"';
}
function buildModelPrompt(q,part,tr){
  var len=(part===2)?'180-220 words':'60-90 words';
  return 'Write a Band 6.5 model answer to this IELTS Speaking Part '+part+' question, '+len+', keeping the learner ideas and order but fixing grammar and vocabulary. Anchor: Band 6.5 means ideas developed at length, successful paraphrase, a mix of sentence forms, and errors only as occasional slips. Output ONLY the model answer text, no title, no quotes, no explanation.\nQuestion: "'+String(q||'').slice(0,300)+'"\nLearner answer: "'+String(tr||'').slice(0,1100)+'"';
}

/* ================= FORECAST ================= */
function pickQuestion(part){
  if(part===1){var t=FORECAST.part1[Math.floor(Math.random()*FORECAST.part1.length)];var q=t.questions[Math.floor(Math.random()*t.questions.length)];return{part:1,topic:t.topic,question:q,text:'🎤 Part 1 — '+t.topic+'\n\n'+q+'\n\nTrả lời bằng chữ hoặc bấm 🎙️ nói nhé — mình chấm ngay như giám khảo IELTS thật.'};}
  if(part===2){var c=FORECAST.part2[Math.floor(Math.random()*FORECAST.part2.length)];var txt='🎤 Part 2 — '+c.topic+'\n\n'+c.prompt+'\nYou should say:\n'+(c.points||[]).map(function(p){return '• '+p;}).join('\n')+'\n\nNói 1–2 phút nhé. Trả lời bằng chữ hoặc bấm 🎙️ — mình chấm ngay.';return{part:2,topic:c.topic,question:c.prompt,text:txt};}
  var t3=FORECAST.part3[Math.floor(Math.random()*FORECAST.part3.length)];var q3=t3.questions[Math.floor(Math.random()*t3.questions.length)];return{part:3,topic:t3.topic,question:q3,text:'🎤 Part 3 — '+t3.topic+'\n\n'+q3+'\n\nTrả lời bằng chữ hoặc bấm 🎙️ nói nhé — mình chấm ngay như giám khảo IELTS thật.'};
}
function askQuestion(part){
  var p=pickQuestion(part);pending={part:p.part,question:p.question,topic:p.topic,askedAt:Date.now()};quiz=null;add(p.text,'bot');return p;
}

/* ================= CHẤM BÀI (nhiều lượt micro) ================= */
async function gradeAnswer(answerText,speechSec){
  var cur=pending;pending=null;
  var tr=String(answerText||'').trim();
  var wc=wordCount(tr);
  var status=add('🦫 Đang chấm bài của bạn theo 4 tiêu chí IELTS — chia nhiều lượt nhỏ nên hơi lâu một chút, đừng tắt trang nhé…','bot think');
  var scores={},feedback={},missing=[];
  /* Chay 2 luot SONG SONG mot cum (app luyen noi cung chay micro song song):
     giam thoi gian cho ma khong spam Pollinations qua muc. */
  async function runCrit(idx){
    var key=CRIT[idx][0],name=CRIT[idx][1];
    try{
      var raw=await polliAsk(buildMicroPrompt(key,name,cur.question,cur.part,tr),POLLI_SYS_GRADE,25000);
      var g=extractJSON(raw);
      var sc=g?validScore(g.score):null;
      if(sc==null){ /* phục hồi kiểu gradeParseWithRecovery: moi điểm bằng regex khi JSON hỏng */
        var m=String(raw||'').match(/score\D{0,6}([3-9](?:\.[05])?)/i);if(m)sc=validScore(parseFloat(m[1]));
      }
      if(sc==null)throw new Error('no score');
      scores[key]=sc;
      if(g){['strength','advice','drill','bandLink','why','descRef'].forEach(function(f){if(g[f]&&/short genuine|in Vietnamese|exact phrase|corrected version/i.test(String(g[f]))&&String(g[f]).length<70)g[f]='';});}
      feedback[key]={strength:String((g&&g.strength)||''),wrong:String((g&&g.wrong)||''),fix:String((g&&g.fix)||''),why:String((g&&g.why)||''),advice:String((g&&g.advice)||''),drill:String((g&&g.drill)||''),bandLink:String((g&&g.bandLink)||''),descRef:String((g&&g.descRef)||'')};
      /* chỉ giữ lỗi trích nguyên văn thật */
      if(feedback[key].wrong && tr.toLowerCase().indexOf(feedback[key].wrong.toLowerCase())<0)feedback[key].wrong='';
    }catch(e){missing.push(key);}
  }
  status.textContent='🦫 Đang chấm FC + LR — lượt 1-2/6…';
  await Promise.all([runCrit(0),runCrit(1)]);
  status.textContent='🦫 Đang chấm GRA + P — lượt 3-4/6…';
  await Promise.all([runCrit(2),runCrit(3)]);
  var errors=[],model='';
  async function runErrors(){
    try{
      var rawE=await polliAsk(buildErrorsPrompt(cur.question,cur.part,tr),POLLI_SYS_GRADE,25000);
      var ge=extractJSON(rawE);
      var list=(ge&&Array.isArray(ge.errors))?ge.errors:[];
      list.forEach(function(it){if(it&&it.wrong&&tr.toLowerCase().indexOf(String(it.wrong).toLowerCase())>=0&&errors.length<3)errors.push({wrong:String(it.wrong),fix:String(it.fix||''),why:String(it.why||'')});});
    }catch(e){missing.push('ERRORS');}
  }
  async function runModel(){
    try{
      var rawM=await polliAsk(buildModelPrompt(cur.question,cur.part,tr),'You are damu, a pink capybara and strict IELTS Speaking examiner. Output ONLY the model answer text.',25000);
      model=unwrapEnvelope(rawM).replace(/^["“]|["”]$/g,'').trim();
      if(model.length<25||/^\{/.test(model))model='';
    }catch(e){missing.push('MODEL');}
  }
  /* Lượt PHỤC HỒI (kiểu gradeParseWithRecovery của app luyện nói): tiêu chí nào
     chết thì xin lại bằng prompt SIÊU NHỎ chỉ lấy điểm + 1 nhận xét ngắn. */
  var critMissing=CRIT.filter(function(c){return missing.indexOf(c[0])>=0;});
  if(critMissing.length){
    status.textContent='🦫 Đang chấm lại phần thiếu: '+critMissing.map(function(c){return c[0];}).join(', ')+'…';
    for(var ri=0;ri<critMissing.length;ri++){
      var rk=critMissing[ri][0],rn=critMissing[ri][1];
      try{
        var rawR=await polliAsk(buildRecoveryPrompt(rk,rn,cur.question,cur.part,tr),POLLI_SYS_GRADE,25000);
        var gr=extractJSON(rawR);var scr=gr?validScore(gr.score):null;
        if(scr==null){var mr=String(rawR||'').match(/score\D{0,6}([3-9](?:\.[05])?)/i);if(mr)scr=validScore(parseFloat(mr[1]));}
        if(scr==null)throw new Error('no score');
        scores[rk]=scr;feedback[rk]={strength:String((gr&&gr.strength)||''),wrong:'',fix:'',why:'',advice:String((gr&&gr.advice)||''),drill:'',bandLink:'',descRef:String((gr&&gr.descRef)||'')};
        missing=missing.filter(function(x){return x!==rk;});
      }catch(e){/* giữ nguyên missing — ghi trung thực ở bản chấm */}
    }
  }
  status.textContent='🦫 Đang soi lỗi trích nguyên văn + viết câu mẫu nâng band — lượt 5-6/6…';
  await Promise.all([runErrors(),runModel()]);
  status.remove();
  var gotKeys=Object.keys(scores);
  var overall=null;
  if(gotKeys.length){var sum=0;gotKeys.forEach(function(k){sum+=scores[k];});overall=Math.round((sum/gotKeys.length)*2)/2;}
  var wpm=null;
  if(speechSec&&speechSec>2&&wc>0)wpm=Math.round(wc/(speechSec/60));
  var lines=[];
  lines.push('📋 BẢN CHẤM — Part '+cur.part+': '+cur.question);
  lines.push('Bài của bạn ('+wc+' từ'+(wpm?(', tốc độ nói ~'+wpm+' WPM ước tính từ thời gian ghi âm'):'')+'): “'+tr+'”');
  if(overall!=null&&gotKeys.length===4)lines.push('\n🎯 Overall (ước tính từ 4 tiêu chí): Band '+overall.toFixed(1));
  else if(overall!=null)lines.push('\n🎯 Điểm trung bình của các tiêu chí chấm được: Band '+overall.toFixed(1)+' — CHƯA đủ 4 tiêu chí nên đây chưa phải overall chính thức.');
  else lines.push('\n⚠️ Chấm điểm thất bại ở tất cả các tiêu chí — mình không bịa điểm. Bấm xin lại câu hỏi và thử chấm lại nhé.');
  if(overall!=null)lines.push('📌 Neo chấm — descriptors chính thức IELTS: chỉ đạt một band khi khớp ĐẦY ĐỦ đặc điểm tích cực của band đó, chưa khớp đủ thì lùi band dưới; điểm là hiệu năng trung bình qua các phần.');
  CRIT.forEach(function(c){
    var k=c[0];
    if(scores[k]==null){lines.push('\n— '+k+' ('+c[1]+'): ⚠️ lượt này lỗi/hết hạn, chưa chấm được.');return;}
    var f=feedback[k]||{};
    lines.push('\n— '+k+' ('+c[1]+'): Band '+scores[k].toFixed(1));
    var dl=descLineFor(k,scores[k]);if(dl)lines.push('  • Đối chiếu descriptor: '+dl);
    if(f.descRef)lines.push('  • Giám khảo đối chiếu: '+f.descRef);
    if(f.strength)lines.push('  • Điểm mạnh: '+f.strength);
    if(f.wrong)lines.push('  • Lỗi: “'+f.wrong+'” → “'+f.fix+'”'+(f.why?' — '+f.why:''));
    if(f.advice)lines.push('  • Cách sửa: '+f.advice);

  });
  if(errors.length){lines.push('\n🔍 Lỗi trích nguyên văn:');errors.forEach(function(e){lines.push('  • “'+e.wrong+'” → “'+e.fix+'”'+(e.why?' — '+e.why:''));});}
  if(model)lines.push('\n✨ Câu mẫu nâng band (Band 6.5):\n'+model);
  if(missing.length)lines.push('\n⚠️ Phần chưa chấm được ở lần này: '+missing.join(', ')+'. Mình hiện phần đã có và ghi rõ phần thiếu — không có điểm giả đâu. Trả lời lại để chấm lại phần thiếu nhé.');
  add(lines.join('\n'),'bot');
  return{scores:scores,overall:overall,missing:missing,errors:errors,model:model,wpm:wpm,words:wc};
}

async function datamuseWords(word,rel){

}
async function wiktDefinition(word){
  var r=await fetchTimeout('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(word),{},12000);
  if(r.status===404)throw new Error('notfound');if(!r.ok)throw new Error('HTTP '+r.status);

}

async function myMemoryVi(word){

async function lookupWord(wordRaw){

/* --- Thêm vào bộ nhớ ôn tập của app từ vựng ---
   Schema thật (đọc từ file nguồn app từ vựng): localStorage key 'vocabSRS.v1'
   = {words:{<id>:{id,word,vi,phonetic,audio,meanings:[{pos,defs:[{def,ex}]}],syn:[],ant:[],prep,forms,createdAt,viGloss,viAuto}},
      cards:[{id,wordId,kind,q,aHTML,ans,need,hints,step,due}], v, streak, lastDay}
   AN TOÀN: chỉ ghi khi store ĐÃ tồn tại; validate shape trước; ghi xong đọc lại
   kiểm chứng; sai định dạng thì khôi phục nguyên trạng cũ và báo lỗi. */
function vocabUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function todayStartMs(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function addToVocabMemory(word){
  var e=dictCache[String(word||'').toLowerCase()];if(!e){add('Chưa có dữ liệu từ này để thêm. Tra lại từ trước nhé.','err');return false;}
  var KEY='vocabSRS.v1',raw=null;
  try{raw=localStorage.getItem(KEY);}catch(err){}
  if(raw==null){add('ℹ️ Chưa có bộ nhớ ôn tập trên trình duyệt này (bạn chưa mở app Ôn từ vựng ở cùng địa chỉ web này). Mở app Ôn từ vựng 1 lần trước, rồi quay lại bấm Thêm nhé — mình không tự tạo store lạ để tránh ghi sai định dạng.','err');return false;}
  var S=null;try{S=JSON.parse(raw);}catch(err){}
  if(!S||typeof S!=='object'||typeof S.words!=='object'||S.words==null||Array.isArray(S.words)||!Array.isArray(S.cards)){add('⚠️ Bộ nhớ ôn tập hiện có định dạng lạ — mình KHÔNG ghi đè để bảo vệ dữ liệu của bạn.','err');return false;}
  var existId=null;for(var id0 in S.words){if(S.words[id0]&&S.words[id0].word&&String(S.words[id0].word).toLowerCase()===e.word)existId=id0;}
  if(existId){add('Từ “'+e.word+'” đã có trong bộ nhớ ôn tập rồi 💗','bot');return true;}
  var id=vocabUid();
  var viShort=e.vi?(e.vi.length<=40?e.vi:''):'';
  S.words[id]={id:id,word:e.word,vi:e.vi||'',phonetic:e.phonetic||'',audio:e.audio||'',meanings:e.meanings||[],syn:e.syn||[],ant:e.ant||[],prep:'',forms:null,createdAt:Date.now(),viGloss:viShort,viAuto:''};
  var aHTML=dictCardHTML(e),due=todayStartMs(),made=0;
  function pushCard(kind,q,ans){if(!ans||!ans.length)return;S.cards.push({id:vocabUid()+(made++),wordId:id,kind:kind,q:q,aHTML:aHTML,ans:ans,need:1,hints:[],step:0,due:due});}
  if(viShort)pushCard('en-vi','<div class="q">'+esc(e.word)+'</div>',[viShort]);
  var fd=e.meanings&&e.meanings[0]&&e.meanings[0].defs&&e.meanings[0].defs[0]?e.meanings[0].defs[0].def:'';
  if(fd||e.vi)pushCard('vi-en','<div class="q">'+esc(e.vi||fd)+'</div>',[e.word]);
  if(e.syn&&e.syn.length)pushCard('syn','Từ đồng nghĩa của «'+esc(e.word)+'» là gì?',e.syn.slice());
  if(e.ant&&e.ant.length)pushCard('ant','Từ trái nghĩa của «'+esc(e.word)+'» là gì?',e.ant.slice());
  var poss=uniq((e.meanings||[]).map(function(m){return String(m.pos||'').toLowerCase().trim();}).filter(Boolean));
  if(poss.length)pushCard('pos','Từ "'+esc(e.word)+'" là từ loại gì?',poss);
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(err){add('⚠️ Không ghi được vào bộ nhớ (trình duyệt chặn?) — dữ liệu cũ vẫn nguyên.','err');return false;}
  /* đọc lại kiểm chứng */
  try{var back=JSON.parse(localStorage.getItem(KEY));var w=back&&back.words&&back.words[id];
    if(!w||w.word!==e.word||!Array.isArray(back.cards))throw new Error('verify');
    var cc=back.cards.filter(function(c){return c.wordId===id;});
    if(cc.length!==made)throw new Error('verify cards');
  }catch(err){try{localStorage.setItem(KEY,raw);}catch(x){}add('⚠️ Ghi xong nhưng đọc lại không khớp định dạng — mình đã khôi phục bộ nhớ như cũ, không thêm từ này.','err');return false;}
  add('✅ Đã thêm “'+e.word+'” vào bộ nhớ ôn tập ('+made+' thẻ). Mở app Ôn từ vựng là thấy từ này trong bài ôn hôm nay.','bot');return true;
}

/* ================= ĐỐ TỪ ================= */
function lev(a,b){a=String(a);b=String(b);var m=[];for(var i=0;i<=b.length;i++)m[i]=[i];for(var j=0;j<=a.length;j++)m[0][j]=j;for(var i2=1;i2<=b.length;i2++)for(var j2=1;j2<=a.length;j2++)m[i2][j2]=Math.min(m[i2-1][j2]+1,m[i2][j2-1]+1,m[i2-1][j2-1]+(a[j2-1]===b[i2-1]?0:1));return m[b.length][a.length];}
function normAns(s){return String(s||'').toLowerCase().trim().replace(/[^a-z'\- ]/g,'').replace(/\s+/g,' ');}
function quizAnswerCorrect(given,answer){var g=normAns(given),a=normAns(answer);if(!g||!a)return false;if(g===a)return true;if(a.length>5&&lev(g,a)<=1)return true;return false;}
async function startQuiz(wordRaw){
  var word=String(wordRaw||'').trim().toLowerCase();if(!word){add('Gõ “đố <từ>” kèm 1 từ tiếng Anh nhé, ví dụ: đố convince','bot');return null;}
  var think=add('🎲 Đang soạn câu đố cho “'+word+'”…','bot think');
  var syn=[],ant=[],defHint='';
  var rs=await Promise.allSettled([datamuseWords(word,'rel_syn'),datamuseWords(word,'rel_ant'),wiktDefinition(word)]);
  if(rs[0].status==='fulfilled')syn=rs[0].value;if(rs[1].status==='fulfilled')ant=rs[1].value;
  if(rs[2].status==='fulfilled'&&rs[2].value[0]&&rs[2].value[0].defs[0])defHint=rs[2].value[0].defs[0].def;
  think.remove();
  var queue=[];syn.slice(0,4).forEach(function(w){queue.push({type:'syn',answer:w});});ant.slice(0,3).forEach(function(w){queue.push({type:'ant',answer:w});});
  if(!queue.length){add('Từ “'+word+'” chưa có dữ liệu đồng/trái nghĩa trên Datamuse nên mình chưa đố được. Thử từ khác nhé.','err');return null;}
  quiz={word:word,queue:queue,i:0,score:0,stage:'ask',defHint:defHint};pending=null;
  add('🎲 ĐỐ TỪ: «'+word+'» — '+queue.length+' câu, hỏi từng từ một. Gõ đáp án tiếng Anh; gõ “dừng” để thoát.','bot');
  add(quizPromptText(),'bot');return quiz;
}
function quizPromptText(){var q=quiz.queue[quiz.i];return 'Câu '+(quiz.i+1)+'/'+quiz.queue.length+': Từ '+(q.type==='syn'?'ĐỒNG':'TRÁI')+' nghĩa với «'+quiz.word+'» là gì?';}
function quizHintText(){var q=quiz.queue[quiz.i];var h='💡 Gợi ý (tiếng Anh trước nhé): ';if(quiz.defHint)h+='«'+quiz.word+'» nghĩa là: '+quiz.defHint+'. ';h+='Đáp án bắt đầu bằng “'+q.answer.charAt(0).toUpperCase()+'” và có '+q.answer.replace(/[^a-z]/gi,'').length+' chữ cái. Thử lại nào!';return h;}
function handleQuizAnswer(text){
  if(/^dừng$|^dung$|^thoát$|^stop$/i.test(text.trim())){var s=quiz.score,t=quiz.queue.length;quiz=null;add('Đã dừng phiên đố. Điểm: '+s+'/'+t+' câu. 🎲','bot');return{done:true};}
  var q=quiz.queue[quiz.i];
  if(quizAnswerCorrect(text,q.answer)){
    quiz.score++;var sc=quiz.score;quiz.i++;quiz.stage='ask';
    if(quiz.i>=quiz.queue.length){var total=quiz.queue.length,wq=quiz.word;quiz=null;add('✅ Đúng rồi! Đáp án: '+q.answer+'.\n🏁 Hết phiên đố «'+wq+'» — điểm của bạn: '+sc+'/'+total+' câu. Giỏi lắm! Bấm Đố từ để chơi tiếp.','bot');return{correct:true,done:true,score:sc};}
    add('✅ Đúng rồi! Đáp án: '+q.answer+'. Điểm hiện tại: '+sc+'/'+quiz.queue.length+'\n\n'+quizPromptText(),'bot');return{correct:true,done:false};
  }
  if(quiz.stage==='ask'){quiz.stage='hint';add('❌ Chưa đúng. '+quizHintText(),'bot');return{correct:false,hint:true};}
  var ans=q.answer;quiz.i++;quiz.stage='ask';
  if(quiz.i>=quiz.queue.length){var total2=quiz.queue.length,sc2=quiz.score,w2=quiz.word;quiz=null;add('❌ Đáp án đúng là: '+ans+'.\n🏁 Hết phiên đố «'+w2+'» — điểm của bạn: '+sc2+'/'+total2+' câu. Ôn thêm rồi đố lại nhé!','bot');return{correct:false,done:true,score:sc2};}
  add('❌ Đáp án đúng là: '+ans+'. Điểm hiện tại: '+quiz.score+'/'+quiz.queue.length+'\n\n'+quizPromptText(),'bot');return{correct:false,done:false};
}

async function send(text){
  text=(text||'').trim();if(!text||busy)return;

  busy=true;sendBtn.disabled=true;

    else if(/^đố\s+/i.test(text)||/^do\s+/i.test(text)){var w2=text.replace(/^(đố|do)\s+/i,'');await startQuiz(w2);}
    else if(pending){var sp=null;if(lastSpeech&&(Date.now()-lastSpeech.at<120000))sp=lastSpeech.durationSec;await gradeAnswer(text,sp);lastSpeech=null;}
    else{await freeChat(text);}
  }catch(e){add('Có lỗi bất ngờ — thử lại giúp mình nhé.','err');}
  busy=false;sendBtn.disabled=false;inp.focus();
}

      micBtn.classList.add('rec');micBtn.textContent='⏹️';
      recog.onresult=function(ev){var interim='',fin='';for(var i=ev.resultIndex;i<ev.results.length;i++){var rr=ev.results[i];if(rr.isFinal)fin+=rr[0].transcript;else interim+=rr[0].transcript;}if(fin)finalText+=fin;inp.value=(finalText+interim).trim();};
      recog.onerror=function(){micBtn.classList.remove('rec');micBtn.textContent='🎙️';recog=null;};
      recog.onend=function(){micBtn.classList.remove('rec');micBtn.textContent='🎙️';var dur=(Date.now()-t0)/1000;recog=null;var txt=inp.value.trim();if(txt){lastSpeech={durationSec:dur,at:Date.now()};if(pending)send(txt);}};
      recog.start();
    }catch(e){recog=null;micBtn.classList.remove('rec');micBtn.textContent='🎙️';add('Không mở được micro / nhận diện giọng nói trên trình duyệt này — gõ đáp án bằng chữ nhé.','err');}
  });
}
